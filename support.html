  <title>精灵物语技术支持</title>
  <style>body{max-width:760px;margin:48px auto;padding:0 22px;background:#071624;color:#eef7f7;font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}h1,h2{color:#dfff79}a{color:#84d7ff}.card{padding:22px;border:1px solid #294757;border-radius:18px;background:#102838}</style>

<body>
  <h1>精灵物语技术支持</h1>
  <div class="card">
    <h2>常见问题</h2>
    <p><strong>天气无法刷新</strong><br>请检查网络后下拉页面或点击右上角刷新。Open-Meteo 暂时不可用时，App 会显示明确标记的演示天气。</p>
    <p><strong>如何更换城市</strong><br>打开底部“城市”页，输入中文或英文城市名搜索。</p>
    <p><strong>如何删除数据</strong><br>点击右上角设置图标，选择“清除本地数据”。</p>
    <h2>联系支持</h2>
    <p>请通过 <a href="https://github.com/jinglingwuyu/jinglingwuyu.github.io/issues">GitHub Issues</a> 联系开发者。</p>
    <p>发送问题时请附上 App 版本、iPhone 型号、iOS 版本和问题截图。</p>
  </div>


</body></html>
